        <!-- Iframe height override — ONLY runs inside the visual-edit iframe
             where debug-monitor.js pins html/body to a fixed height. Outside
             the iframe (i.e. for real users on mobile) the CSS in
             index.css / App.css already wires up:
                html { overflow-y: auto; -webkit-overflow-scrolling: touch }
                body { overflow-x: hidden; overflow-y: auto }
             which is the only correct configuration for iOS Safari touch
             scrolling. Previously this <script> forced
             `body.style.overflow = 'visible'` then `overflowY = 'auto'`,
             producing computed `overflow: visible auto` on body. iOS Safari
             will NOT treat a `overflow: visible auto` body as a touch
             scroll container, so all mobile drag was silently swallowed. -->
        <script>
        (function() {
          'use strict';
          // Only patch styles when we're embedded in the visual-edit iframe.
          // Real users on real devices must not have any inline overflow
          // mutations on <body> or <html>, or mobile scroll breaks.
          if (window.self === window.top) return;

          const enforceScrollContext = () => {
            // HTML is the SOLE scroll container. Body must NOT have
            // overflow-y: auto, or Android Chrome's compositor terminates
            // scroll chaining at body and silently consumes single-finger
            // gestures (body.scrollHeight === body.clientHeight → no room).
            document.documentElement.style.height = 'auto';
            document.documentElement.style.minHeight = '100vh';
            document.documentElement.style.overflowX = 'hidden';
            document.documentElement.style.overflowY = 'auto';

            document.body.style.height = 'auto';
            document.body.style.minHeight = '';
            document.body.style.overflowX = 'clip';
            document.body.style.overflowY = '';
            document.body.style.position = 'relative';
          };

          enforceScrollContext();

          // Watch for the iframe runtime forcing html/body to a fixed height
          // (e.g. `height: 1080px`) and only then re-assert auto height.
          if (typeof MutationObserver !== 'undefined') {
            const observer = new MutationObserver(function() {
              const htmlH = getComputedStyle(document.documentElement).height;
              const bodyH = getComputedStyle(document.body).height;
              if (htmlH === '1080px' || bodyH === '1080px') {
                enforceScrollContext();
              }
            });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
            observer.observe(document.body, { attributes: true, attributeFilter: ['style'] });
          }
        })();
        </script>
